<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My To-Do List</title>

  <!-- 1. TAILWIND CSS from a CDN (no installation needed) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ============ 2. HTML STRUCTURE ============ -->
  <main class="max-w-xl mx-auto px-4 py-10">

    <h1 class="text-3xl font-bold text-center text-indigo-700">My To-Do List</h1>
    <p class="text-center text-slate-500 mt-1 mb-6">Plan your study and personal tasks.</p>

    <!-- Add task area -->
    <div class="flex gap-2 mb-2">
      <input
        id="taskInput"
        type="text"
        placeholder="e.g. Finish DBMS assignment"
        class="flex-1 px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
      <button id="addBtn" class="px-5 py-3 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">
        Add
      </button>
    </div>

    <!-- Error message (hidden until needed) -->
    <p id="errorMsg" class="hidden text-sm text-red-600 mb-2">Please type a task before adding.</p>

    <!-- Counter -->
    <p id="counter" class="text-sm text-slate-500 my-4"></p>

    <!-- The task list. JavaScript fills this in. -->
    <ul id="taskList" class="space-y-2"></ul>

    <!-- Shown when there are no tasks -->
    <p id="emptyMsg" class="text-center text-slate-400 mt-8">No tasks yet. Add your first one above.</p>

    <!-- Clear completed button -->
    <button id="clearBtn" class="hidden mt-6 text-sm px-3 py-1.5 rounded bg-slate-300 hover:bg-slate-400">
      Clear completed tasks
    </button>
  </main>

  <!-- ============ 3. JAVASCRIPT ============ -->
  <script>
    // Step 1: Select the elements we need from the page (DOM)
    const taskInput = document.getElementById("taskInput");
    const addBtn    = document.getElementById("addBtn");
    const errorMsg  = document.getElementById("errorMsg");
    const taskList  = document.getElementById("taskList");
    const emptyMsg  = document.getElementById("emptyMsg");
    const counter   = document.getElementById("counter");
    const clearBtn  = document.getElementById("clearBtn");

    // Step 2: Our data. Each task is an object: { id, text, done }
    let tasks = [];
    let nextId = 1;

    // Step 3: Draw the list on the page from the tasks array.
    // We call this function every time the data changes.
    function render() {
      taskList.innerHTML = "";   // clear the old list first

      tasks.forEach(function (task) {
        // Create a <li> for this task
        const li = document.createElement("li");
        li.className = "flex items-center gap-3 bg-white rounded-lg shadow-sm border border-slate-200 px-4 py-3";

        // Checkbox: mark as completed
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.className = "w-5 h-5 accent-indigo-600 cursor-pointer";
        checkbox.addEventListener("change", function () {
          task.done = checkbox.checked;   // update the data
          render();                       // redraw the page
        });

        // Task text (crossed out if completed)
        const span = document.createElement("span");
        span.textContent = task.text;
        span.className = task.done
          ? "flex-1 line-through text-slate-400"
          : "flex-1";

        // Delete button
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "text-sm text-red-600 hover:text-red-800";
        delBtn.addEventListener("click", function () {
          // Keep every task except the one we are deleting
          tasks = tasks.filter(function (t) { return t.id !== task.id; });
          render();
        });

        // Put everything inside the <li>, then the <li> inside the <ul>
        li.append(checkbox, span, delBtn);
        taskList.appendChild(li);
      });

      // Update counter, empty message and clear button
      const doneCount = tasks.filter(function (t) { return t.done; }).length;
      counter.textContent = doneCount + " of " + tasks.length + " tasks completed";
      emptyMsg.classList.toggle("hidden", tasks.length > 0);
      counter.classList.toggle("hidden", tasks.length === 0);
      clearBtn.classList.toggle("hidden", doneCount === 0);
    }

    // Step 4: Add a new task
    function addTask() {
      const text = taskInput.value.trim();   // trim removes extra spaces

      if (text === "") {
        errorMsg.classList.remove("hidden");   // show error
        return;
      }

      errorMsg.classList.add("hidden");
      tasks.push({ id: nextId++, text: text, done: false });
      taskInput.value = "";    // empty the input box
      taskInput.focus();
      render();
    }

    // Step 5: Event listeners
    addBtn.addEventListener("click", addTask);

    // Pressing Enter in the input box also adds the task
    taskInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") addTask();
    });

    // Remove all completed tasks at once
    clearBtn.addEventListener("click", function () {
      tasks = tasks.filter(function (t) { return !t.done; });
      render();
    });

    // Draw the page for the first time
    render();
  </script>
</body>
</html>
